backend:
  name: git-gateway
  branch: main
  accept_roles:
    - admin
    - teacher

local_backend: true
publish_mode: simple
locale: ja

site_url: https://abepianoroom.netlify.app
display_url: https://abepianoroom.netlify.app
media_folder: image/uploads
public_folder: /image/uploads

collections:
  - name: home_text
    label: トップページ本文
    editor:
      preview: false
    files:
      - name: home_text
        label: トップページ本文
        file: content/home-text.json
        format: json
        fields:
          - label: schemaVersion
            name: schemaVersion
            widget: hidden
            default: 2
          - label: セクション1
            name: greeting
            widget: object
            fields:
              - label: ページに表示する見出し
                name: title
                widget: string
                pattern:
                  - "^.{1,18}$"
                  - "18文字以内で入力してください"
              - label: 本文ブロック
                name: blocks
                widget: list
                summary: "{{fields.label}}"
                collapsed: true
                allow_add: false
                min: 2
                max: 2
                fields:
                  - label: 内部ID
                    name: id
                    widget: hidden
                  - label: ブロック名
                    name: label
                    widget: string
                    pattern:
                      - "^.{1,28}$"
                      - "28文字以内で入力してください"
                  - label: 本文
                    name: text
                    widget: text
          - label: セクション2
            name: targetLocation
