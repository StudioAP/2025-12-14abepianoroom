        function renderHeroPrimaryCta() {
            const ctaEl = document.getElementById("hero-primary-cta");
            const ctaRowEl = document.getElementById("hero-cta-row");
            if (!ctaEl) return;
            const heroConfig = config.hero || {};
            const primaryCta = heroConfig.primaryCta || {};
            const fallbackContact = config.contactNav || {};
            const label = String(primaryCta.label || fallbackContact.label || "お問合せ").trim();
            const href = String(primaryCta.href || fallbackContact.href || "").trim();
            const isExternal = Boolean(primaryCta.external) || /^https?:\/\//.test(href);

            if (!label || !href) {
                ctaEl.hidden = true;
                ctaEl.removeAttribute("href");
                ctaEl.textContent = "";
                if (ctaRowEl) {
                    ctaRowEl.hidden = true;
                }
                return;
            }

            ctaEl.textContent = label;
            ctaEl.setAttribute("href", href);
            if (isExternal) {
                ctaEl.setAttribute("target", "_blank");
                ctaEl.setAttribute("rel", "noopener");
            } else {
                ctaEl.removeAttribute("target");
                ctaEl.removeAttribute("rel");
            }
            ctaEl.hidden = false;
            if (ctaRowEl) {
                ctaRowEl.hidden = false;
            }
        }

        function syncMobileQuickNavVisibility() {
            const nav = document.getElementById("mobile-quick-nav");
            const sectionNav = document.getElementById("section-nav");
            if (!nav) return;
            const hasLinks = nav.dataset.hasLinks === "true";
            const isMobileViewport = window.matchMedia("(max-width: 768px)").matches;
            if (!hasLinks || !isMobileViewport) {
                nav.hidden = true;
                document.body.classList.remove("has-mobile-quick-nav");
                document.body.classList.remove("mobile-nav-primary-quick");
                if (sectionNav) {
                    sectionNav.hidden = false;
                }
                return;
            }

            const heroEl = document.getElementById("hero-slider");
            const noticeEl = document.getElementById("hero-notice");
            const ctaRowEl = document.getElementById("hero-cta-row");
            const heroBottom = heroEl
                ? Math.max(0, heroEl.getBoundingClientRect().bottom + window.scrollY)
                : 0;
            const noticeBottom = noticeEl && !noticeEl.hidden
                ? Math.max(heroBottom, noticeEl.getBoundingClientRect().bottom + window.scrollY)
                : heroBottom;
            const ctaRowBottom = ctaRowEl && !ctaRowEl.hidden
                ? Math.max(noticeBottom, ctaRowEl.getBoundingClientRect().bottom + window.scrollY)
                : noticeBottom;
            const revealAt = Math.max(72, Math.round(ctaRowBottom));
            const shouldShow = window.scrollY >= revealAt;

            nav.hidden = !shouldShow;
            document.body.classList.toggle("has-mobile-quick-nav", shouldShow);
            document.body.classList.toggle("mobile-nav-primary-quick", shouldShow);
            if (sectionNav) {
                sectionNav.hidden = shouldShow;
            }
            if (shouldShow) {
                closeSectionNavMenu({ blurToggle: true });
            }
        }

        function renderMobileQuickLinks() {
            const nav = document.getElementById("mobile-quick-nav");
            const navList = document.getElementById("mobile-quick-nav-list");
            if (!nav || !navList) return;
            const links = (config.mobileQuickLinks || []).filter((link) => link && link.label && link.href);
            if (links.length === 0) {
                nav.dataset.hasLinks = "false";
                nav.hidden = true;
                navList.innerHTML = "";
                document.body.classList.remove("has-mobile-quick-nav");
                return;
            }
            navList.innerHTML = links.map((link) => {
                const rawLabel = String(link.label || "");
                const label = escapeHtml(rawLabel);
                const href = escapeHtml(String(link.href || ""));
                const isExternal = Boolean(link.external) || /^https?:\/\//.test(String(link.href || ""));
                const target = isExternal ? ` target="_blank" rel="noopener"` : "";
                return `<a class="mobile-quick-link" href="${href}"${target}>${label}</a>`;
            }).join("");
            nav.dataset.hasLinks = "true";
            syncMobileQuickNavVisibility();
        }

        function mountHeroSlides(images, options = {}) {
            const { append = true, activateFirst = false } = options;
            const heroContainer = document.getElementById('hero-slider');
            if (!heroContainer) return [];
            const heroText = heroContainer.querySelector('.hero-txt');
            if (!append) {
                heroContainer.querySelectorAll('.slide').forEach((slide) => slide.remove());
            }
            const slideElements = [];
            (images || []).forEach((image, index) => {
                const normalizedImage = normalizeImagePath(image);
                if (!normalizedImage) return;
                const div = document.createElement('div');
                div.className = 'slide';
                div.style.backgroundImage = `url('${toSrc(normalizedImage)}')`;
                if (activateFirst && index === 0) {
                    div.classList.add('active');
                }
                if (heroText) {
                    heroContainer.insertBefore(div, heroText);
                } else {
                    heroContainer.appendChild(div);
                }
                slideElements.push(div);
            });
            return slideElements;
        }

        function applyHeroTextTheme(theme) {
            const heroTexts = Array.from(document.querySelectorAll(".hero-txt"));
            if (heroTexts.length === 0) return;
            const body = document.body;
            const resolved = body && body.classList.contains("hero-band-inphoto-top-plain")
                ? HERO_TEXT_INPHOTO_PLAIN_THEME
                : (theme || HERO_TEXT_FALLBACK_THEME);
            heroTexts.forEach((heroText) => {
                heroText.style.setProperty("--hero-fg", resolved.color);
                heroText.style.setProperty("--hero-shadow", resolved.textShadow);
                heroText.style.setProperty("--hero-stroke-color", resolved.strokeColor || "rgba(0, 0, 0, 0.72)");
                heroText.style.setProperty("--hero-stroke-width", resolved.strokeWidth || "0.8px");
            });
        }

        function resolveHeroTextTheme(imagePath) {
            const normalizedImagePath = normalizeImagePath(imagePath);
            if (normalizedImagePath && heroTextThemeMap.has(normalizedImagePath)) {
                return heroTextThemeMap.get(normalizedImagePath);
            }
            return HERO_TEXT_FALLBACK_THEME;
        }

        function normalizeHeroAspectRatio(value) {
            const numeric = Number(value);
            if (!Number.isFinite(numeric) || numeric <= 0) {
                return HERO_ACTIVE_RATIO_DEFAULT;
            }
            return Math.min(HERO_ACTIVE_RATIO_MAX, Math.max(HERO_ACTIVE_RATIO_MIN, numeric));
        }

        function applyHeroMobileAspectRatio(imagePath) {
            const hero = document.getElementById("hero-slider");
            if (!hero) return;
            const normalizedImagePath = normalizeImagePath(imagePath);
            const ratioFromMap = normalizedImagePath && heroImageRatioMap.has(normalizedImagePath)
                ? heroImageRatioMap.get(normalizedImagePath)
                : HERO_ACTIVE_RATIO_DEFAULT;
            const safeRatio = normalizeHeroAspectRatio(ratioFromMap);
            hero.style.setProperty("--hero-active-ratio", String(safeRatio));
        }

        async function buildHeroImageRatioMap(images) {
            const ratioMap = new Map();
            for (const imagePath of images || []) {
                const normalizedImagePath = normalizeImagePath(imagePath);
                if (!normalizedImagePath || ratioMap.has(normalizedImagePath)) continue;
                try {
                    const ratio = await sampleImageAspectRatio(normalizedImagePath);
                    ratioMap.set(normalizedImagePath, normalizeHeroAspectRatio(ratio));
                } catch (_) {
                    ratioMap.set(normalizedImagePath, HERO_ACTIVE_RATIO_DEFAULT);
                }
            }
            return ratioMap;
        }

        async function buildHeroTextThemeMap(images) {
            const themeMap = new Map();
            for (const imagePath of images || []) {
                const normalizedImagePath = normalizeImagePath(imagePath);
                if (!normalizedImagePath) continue;
                try {
                    const luminanceStats = await sampleLuminanceFromImage(normalizedImagePath, HERO_TEXT_REGION);
                    themeMap.set(normalizedImagePath, createHeroTextTheme(luminanceStats));
                } catch (_) {
                    themeMap.set(normalizedImagePath, HERO_TEXT_FALLBACK_THEME);
                }
            }
            return themeMap;
        }

        async function sampleImageAspectRatio(imagePath) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.decoding = "async";
                image.onload = () => {
                    const width = Math.max(1, Number(image.naturalWidth) || 1);
                    const height = Math.max(1, Number(image.naturalHeight) || 1);
                    resolve(width / height);
                };
                image.onerror = () => reject(new Error(`hero image ratio load failed: ${imagePath}`));
                image.src = toSrc(imagePath);
            });
        }

        function normalizeLuminanceStats(stats) {
            const clamp = (value) => Math.min(1, Math.max(0, Number.isFinite(value) ? value : 0.5));
            const p50 = clamp(stats && stats.p50);
            return {
                p10: clamp(stats && stats.p10),
                p50,
                p90: clamp(stats && stats.p90)
            };
        }

        function createHeroTextTheme(luminanceStats) {
            const safeStats = normalizeLuminanceStats(luminanceStats);
            const whiteContrast = contrastRatio(1, safeStats.p90);
            const darkLuminance = getRelativeLuminanceFromHex(HERO_TEXT_DARK_COLOR);
            const darkContrast = contrastRatio(darkLuminance, safeStats.p10);
            const useDarkText = darkContrast > whiteContrast;
            const color = useDarkText ? HERO_TEXT_DARK_COLOR : HERO_TEXT_LIGHT_COLOR;
            const contrast = useDarkText ? darkContrast : whiteContrast;

            let textShadow = useDarkText
                ? "0 1px 10px rgba(255, 255, 255, 0.46), 0 0 2px rgba(255, 255, 255, 0.40)"
                : "0 1px 10px rgba(0, 0, 0, 0.72), 0 0 2px rgba(0, 0, 0, 0.66)";
            let strokeColor = useDarkText ? "rgba(255, 255, 255, 0.82)" : "rgba(0, 0, 0, 0.86)";
            let strokeWidth = "0.75px";
            if (contrast < HERO_TEXT_MIN_CONTRAST) {
                textShadow = useDarkText
                    ? "0 2px 12px rgba(255, 255, 255, 0.62), 0 0 3px rgba(255, 255, 255, 0.52)"
                    : "0 2px 12px rgba(0, 0, 0, 0.82), 0 0 3px rgba(0, 0, 0, 0.72)";
                strokeWidth = "1.02px";
            }
            if (contrast < 3.5) {
                textShadow = useDarkText
                    ? "0 3px 16px rgba(255, 255, 255, 0.74), 0 0 4px rgba(255, 255, 255, 0.64)"
                    : "0 3px 16px rgba(0, 0, 0, 0.92), 0 0 4px rgba(0, 0, 0, 0.82)";
                strokeColor = useDarkText ? "rgba(255, 255, 255, 0.94)" : "rgba(0, 0, 0, 0.94)";
                strokeWidth = "1.22px";
            }

            return { color, textShadow, strokeColor, strokeWidth };
        }

        async function sampleLuminanceFromImage(imagePath, region) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.decoding = "async";
                image.onload = () => {
                    try {
                        const maxSide = 320;
                        const widthRatio = maxSide / Math.max(1, image.naturalWidth || 1);
                        const heightRatio = maxSide / Math.max(1, image.naturalHeight || 1);
                        const ratio = Math.min(1, widthRatio, heightRatio);
                        const canvasWidth = Math.max(1, Math.round((image.naturalWidth || 1) * ratio));
                        const canvasHeight = Math.max(1, Math.round((image.naturalHeight || 1) * ratio));

                        const canvas = document.createElement("canvas");
                        canvas.width = canvasWidth;
                        canvas.height = canvasHeight;
                        const context = canvas.getContext("2d", { willReadFrequently: true });
                        if (!context) {
                            resolve({ p10: 0.5, p50: 0.5, p90: 0.5 });
                            return;
                        }
                        context.drawImage(image, 0, 0, canvasWidth, canvasHeight);

                        const xStart = Math.max(0, Math.floor(region.xStart * canvasWidth));
                        const xEnd = Math.min(canvasWidth, Math.ceil(region.xEnd * canvasWidth));
                        const yStart = Math.max(0, Math.floor(region.yStart * canvasHeight));
                        const yEnd = Math.min(canvasHeight, Math.ceil(region.yEnd * canvasHeight));
                        const sampleWidth = Math.max(1, xEnd - xStart);
                        const sampleHeight = Math.max(1, yEnd - yStart);
                        const pixels = context.getImageData(xStart, yStart, sampleWidth, sampleHeight).data;

                        const luminanceSamples = [];
                        for (let gy = 0; gy < HERO_TEXT_SAMPLE_GRID; gy++) {
                            for (let gx = 0; gx < HERO_TEXT_SAMPLE_GRID; gx++) {
                                const px = Math.min(
                                    sampleWidth - 1,
                                    Math.max(0, Math.floor(((gx + 0.5) / HERO_TEXT_SAMPLE_GRID) * sampleWidth))
                                );
                                const py = Math.min(
                                    sampleHeight - 1,
                                    Math.max(0, Math.floor(((gy + 0.5) / HERO_TEXT_SAMPLE_GRID) * sampleHeight))
                                );
                                const idx = (py * sampleWidth + px) * 4;
                                const alpha = pixels[idx + 3] / 255;
                                if (alpha <= 0) continue;
                                const luminance = rgbToRelativeLuminance(
                                    pixels[idx],
                                    pixels[idx + 1],
                                    pixels[idx + 2]
                                );
                                luminanceSamples.push(luminance);
                            }
                        }

                        if (luminanceSamples.length === 0) {
                            resolve({ p10: 0.5, p50: 0.5, p90: 0.5 });
                            return;
                        }
                        luminanceSamples.sort((a, b) => a - b);
                        const lastIndex = luminanceSamples.length - 1;
                        const pick = (ratio) => luminanceSamples[Math.floor(lastIndex * ratio)];
                        resolve({
                            p10: pick(0.1),
                            p50: pick(0.5),
                            p90: pick(0.9)
                        });
                    } catch (error) {
                        reject(error);
                    }
                };
                image.onerror = () => reject(new Error(`hero image load failed: ${imagePath}`));
                image.src = toSrc(imagePath);
            });
        }

        function rgbToRelativeLuminance(r, g, b) {
            const toLinear = (channel) => {
                const srgb = channel / 255;
                if (srgb <= 0.03928) {
                    return srgb / 12.92;
                }
                return ((srgb + 0.055) / 1.055) ** 2.4;
            };

            const lr = toLinear(r);
            const lg = toLinear(g);
            const lb = toLinear(b);
            return 0.2126 * lr + 0.7152 * lg + 0.0722 * lb;
        }

        function getRelativeLuminanceFromHex(hex) {
            const normalized = String(hex || "").replace("#", "");
            if (!/^[0-9a-fA-F]{6}$/.test(normalized)) {
                return 0;
            }
            const r = Number.parseInt(normalized.slice(0, 2), 16);
            const g = Number.parseInt(normalized.slice(2, 4), 16);
            const b = Number.parseInt(normalized.slice(4, 6), 16);
            return rgbToRelativeLuminance(r, g, b);
        }

        function contrastRatio(l1, l2) {
            const lighter = Math.max(l1, l2);
            const darker = Math.min(l1, l2);
            return (lighter + 0.05) / (darker + 0.05);
        }

        function classifyHeadingLine(line) {
            const text = String(line || "").trim();
            if (!text) return "";
            if (/^[◉✴]/.test(text) || /^【[^】]+】/.test(text) || /^〈[^〉]+〉/.test(text)) {
                return "h3";
            }
            return "";
        }

        function normalizeHeadingText(line) {
            const text = String(line || "").trim();
            const mediumMatch = text.match(/^【([^】]+)】\s*(.*)$/);
            if (mediumMatch) {
                return [mediumMatch[1], mediumMatch[2]].filter(Boolean).join(" ").trim();
            }
            const smallMatch = text.match(/^〈([^〉]+)〉\s*(.*)$/);
            if (smallMatch) {
                return [smallMatch[1], smallMatch[2]].filter(Boolean).join(" ").trim();
            }
            return text.replace(/^[◉✴・]\s*/, "").trim();
        }

        function flushParagraphBuffer(paragraphBuffer, chunks) {
            if (paragraphBuffer.length === 0) return;
            chunks.push({ type: "p", lines: [...paragraphBuffer] });
            paragraphBuffer.length = 0;
        }

        function parseTextLines(lines, options = {}) {
            const chunks = [];
            const paragraphBuffer = [];
            const sectionTitle = String(options.sectionTitle || "").trim();
            const isCourseSection = sectionTitle === "コース・曜日・料金";
            const strongCourseHeadings = new Set([
                "グループレッスン（各クラス2〜3名）",
                "個人レッスン"
            ]);
            let expectCoursePairSubheading = false;
            (lines || []).forEach((line) => {
                const rawLine = String(line || "");
                const trimmed = rawLine.trim();
                if (!trimmed) {
                    flushParagraphBuffer(paragraphBuffer, chunks);
                    expectCoursePairSubheading = false;
                    return;
                }
                const headingType = classifyHeadingLine(trimmed);
                const normalizedHeading = headingType ? normalizeHeadingText(trimmed) : trimmed;
                if (isCourseSection && strongCourseHeadings.has(normalizedHeading)) {
                    flushParagraphBuffer(paragraphBuffer, chunks);
                    chunks.push({ type: "h3_strong", text: normalizedHeading });
                    expectCoursePairSubheading = true;
                    return;
                }
                if (isCourseSection && expectCoursePairSubheading && (normalizedHeading === "親子ペアでのご参加" || normalizedHeading === "親子ペアでの参加")) {
                    flushParagraphBuffer(paragraphBuffer, chunks);
                    const pairLabel = normalizedHeading.replace("ご参加", "参加");
                    const lastChunk = chunks.length > 0 ? chunks[chunks.length - 1] : null;
                    if (lastChunk && lastChunk.type === "h3_strong") {
                        lastChunk.pairLabel = pairLabel;
                    } else {
                        chunks.push({ type: "h4_strong", text: pairLabel });
                    }
                    expectCoursePairSubheading = false;
                    return;
                }
                expectCoursePairSubheading = false;
                if (headingType) {
                    flushParagraphBuffer(paragraphBuffer, chunks);
                    chunks.push({ type: headingType, text: normalizeHeadingText(trimmed) });
                    return;
                }
                paragraphBuffer.push(trimmed);
            });
            flushParagraphBuffer(paragraphBuffer, chunks);
            return chunks;
        }

        function normalizeTextFlow(mode) {
            return String(mode || "").trim().toLowerCase() === "structured" ? "structured" : "natural";
        }

        function splitLineBySentence(line) {
            const text = String(line || "").trim();
            if (!text) return [];
            const closers = "」』）)］]】〉》”’\"'";
            const quotePairs = {
                "「": "」",
                "『": "』",
                "“": "”",
                "‘": "’",
                "\"": "\"",
                "'": "'"
            };
            const quoteClosers = new Set(Object.values(quotePairs));
            const segments = [];
            let buffer = "";
            const quoteStack = [];

            for (let i = 0; i < text.length; i += 1) {
                const ch = text[i];
                buffer += ch;

                if (quotePairs[ch]) {
                    const closer = quotePairs[ch];
                    const topCloser = quoteStack[quoteStack.length - 1];
                    if (topCloser === closer && (ch === "\"" || ch === "'")) {
                        quoteStack.pop();
                    } else {
                        quoteStack.push(closer);
                    }
                } else if (quoteClosers.has(ch)) {
                    if (quoteStack.length > 0) {
                        const topCloser = quoteStack[quoteStack.length - 1];
                        if (topCloser === ch) {
                            quoteStack.pop();
                        } else {
                            const idx = quoteStack.lastIndexOf(ch);
                            if (idx !== -1) {
                                quoteStack.splice(idx, 1);
                            }
                        }
                    }
                }

                if (ch !== "。") continue;
                if (quoteStack.length > 0) continue;
                while (i + 1 < text.length && closers.includes(text[i + 1])) {
                    i += 1;
                    buffer += text[i];
                }
                const sentence = buffer.trim();
                if (sentence) segments.push(sentence);
                buffer = "";
            }

            const rest = buffer.trim();
            if (rest) segments.push(rest);
            return segments;
        }

        function formatParagraphLines(lines, mode = "natural") {
            const KOGUMA_URL = "https://koguma-rythmique.netlify.app/";
            const KOGUMA_LINK_HTML = `<a class="stream-inline-link" href="${escapeHtml(KOGUMA_URL)}" target="_blank" rel="noopener">こぐまリトミッククラスを見る</a>`;

            const replaceKnownLinks = (htmlText) => {
                if (!htmlText) return "";
                const escapedUrl = escapeHtml(KOGUMA_URL);
                return htmlText.split(escapedUrl).join(KOGUMA_LINK_HTML);
            };

            const normalizedMode = normalizeTextFlow(mode);
            const rawLines = (lines || [])
                .map((line) => String(line || "").trim())
            const preparedLines = rawLines.filter(Boolean);
            if (preparedLines.length === 0) return "";
            const hasKnownLinkLine = rawLines.some((line) => line === KOGUMA_URL);
            if (normalizedMode === "structured" || hasKnownLinkLine) {
                const sourceLines = hasKnownLinkLine ? rawLines : preparedLines;
                return replaceKnownLinks(sourceLines.map((line) => escapeHtml(line)).join("<br>"));
            }
            const mergedText = preparedLines.join("");
            const sentenceLines = splitLineBySentence(mergedText);
            return replaceKnownLinks(sentenceLines.map((line) => escapeHtml(line)).join("<br>"));
        }

        function filterGalleryImages(images, sectionCoverImage) {
            const normalizedCover = normalizeImagePath(sectionCoverImage);
            const normalizedImages = (images || [])
                .map((image) => normalizeGalleryImageEntry(image))
                .filter(Boolean);
            if (!normalizedCover) return normalizedImages;
            return normalizedImages.filter((entry) => entry.src !== normalizedCover);
        }

        function retryImageWithAltNormalization(imgEl) {
            if (!imgEl) return;
            const sourcePath = normalizeImagePath(imgEl.getAttribute("data-image-path") || "");
            if (!sourcePath) return;
            const candidates = buildImagePathCandidates(sourcePath);
            if (candidates.length <= 1) return;
            const currentIndex = Number.parseInt(imgEl.dataset.imagePathCandidateIndex || "0", 10);
            const safeCurrentIndex = Number.isFinite(currentIndex) ? currentIndex : 0;
            const nextIndex = safeCurrentIndex + 1;
            if (nextIndex >= candidates.length) return;
            imgEl.dataset.imagePathCandidateIndex = String(nextIndex);
            imgEl.src = encodeURI(candidates[nextIndex]);
        }

        function attachImageFallbackHandlers(root) {
            const scope = root || document;
            scope.querySelectorAll("img[data-image-path]").forEach((img) => {
                if (img.dataset.retryNfcBound === "1") return;
                img.dataset.retryNfcBound = "1";
                if (!img.dataset.imagePathCandidateIndex) {
                    img.dataset.imagePathCandidateIndex = "0";
                }
                img.addEventListener("error", () => {
                    retryImageWithAltNormalization(img);
                });
            });
        }

        function renderTextChunks(chunks, mode = "natural") {
            return (chunks || []).map((chunk) => {
                if (chunk.type === "h3_strong") {
                    const headingText = String(chunk.text || "");
                    const pairLabel = String(chunk.pairLabel || "").trim();
                    const groupHeadingMatch = headingText.match(/^(.+?)(（各クラス[^）]+）)$/);
                    const headingMainHtml = groupHeadingMatch
                        ? `<span class="stream-h3-main">${escapeHtml(groupHeadingMatch[1])}<span class="stream-h3-inline-meta">${escapeHtml(groupHeadingMatch[2])}</span></span>`
                        : `<span class="stream-h3-main">${escapeHtml(headingText)}</span>`;
                    const pairLabelHtml = pairLabel
                        ? `<span class="stream-h3-inline-sub">${escapeHtml(pairLabel)}</span>`
                        : "";
                    return `<h3 class="stream-h3-strong">${headingMainHtml}${pairLabelHtml}</h3>`;
                }
                if (chunk.type === "h4_strong") {
                    return `<h4 class="stream-h4-strong">${escapeHtml(chunk.text)}</h4>`;
                }
                if (chunk.type === "h3") {
                    return `<h3 class="stream-h3">${escapeHtml(chunk.text)}</h3>`;
                }
                if (chunk.type === "h4") {
                    return `<h4 class="stream-h4">${escapeHtml(chunk.text)}</h4>`;
                }
                return `<p class="stream-p">${formatParagraphLines(chunk.lines || [], mode)}</p>`;
            }).join("");
        }

        function resolveOptionalBlockClassName(rawClassName) {
            const className = String(rawClassName || "").trim();
            return /^[a-zA-Z0-9_-]+$/.test(className) ? className : "";
        }

        function renderQuoteBlock(block) {
            const rawText = String((block && block.text) || "");
            const text = escapeHtml(rawText).replace(/\n/g, "<br>");
            const author = escapeHtml(String((block && block.author) || ""));
            const quoteClassName = resolveOptionalBlockClassName(block && block.className);
            const quoteClassAttr = quoteClassName ? `stream-quote ${quoteClassName}` : "stream-quote";
            const sourceLabel = "「かんがえる子ども」(福音館書店)";
            const escapedSourceLabel = escapeHtml(sourceLabel);
            const styledAuthor = author.includes(escapedSourceLabel)
                ? author.replace(
                    escapedSourceLabel,
                    `<span class="stream-quote-author-source">${escapedSourceLabel}</span>`
                )
                : author;
            if (!rawText.trim()) return "";
            const authorHtml = styledAuthor ? `<cite class="stream-quote-author">${styledAuthor}</cite>` : "";
            return `
                <blockquote class="${quoteClassAttr}">
                    <p class="stream-quote-text">${text}</p>
                    ${authorHtml}
                </blockquote>
            `;
        }

        function renderGalleryBlock(block, sectionCoverImage, options = {}) {
            const filteredImages = filterGalleryImages(block.images || [], sectionCoverImage);
            if (filteredImages.length === 0) {
                return "";
            }
            const gallery = filteredImages
                .map((imageEntry) => {
                    const imagePath = imageEntry.src;
                    const imageClass = shouldUseNativeRatioImage(imagePath)
                        ? "stream-gallery-image stream-gallery-image--native-ratio"
                        : "stream-gallery-image";
                    const captionText = String(imageEntry.caption || "").trim();
                    const altText = String(imageEntry.alt || captionText || "").trim();
                    const imageHtml = `<img class="${imageClass}" src="${toSrc(imagePath)}" data-image-path="${escapeHtml(imagePath)}" alt="${escapeHtml(altText)}" loading="lazy" decoding="async">`;
                    const captionHtml = captionText
                        ? `<figcaption class="stream-gallery-caption">${escapeHtml(captionText)}</figcaption>`
                        : "";
                    return `<figure class="stream-gallery-item">${imageHtml}${captionHtml}</figure>`;
                })
                .join("");
            const galleryClassName = resolveOptionalBlockClassName(block && block.className);
            const galleryClassAttr = galleryClassName ? `stream-gallery ${galleryClassName}` : "stream-gallery";
            const galleryHtml = `<div class="${galleryClassAttr}">${gallery}</div>`;
            const shouldMobileCollapse = Boolean(options && options.mobileCollapse) && filteredImages.length > 1;
            if (!shouldMobileCollapse) {
                return galleryHtml;
            }
            return `<div class="stream-gallery-wrap stream-gallery-wrap--mobile-collapsible">${galleryHtml}<button type="button" class="stream-gallery-more" aria-expanded="false" data-label-open="other photos" data-label-close="close photos"><span class="stream-gallery-more-text">other photos</span><span class="stream-gallery-more-icon" aria-hidden="true">▼</span></button></div>`;
        }

        function shouldUseNativeRatioImage(imagePath) {
            const normalizedImage = normalizeImagePath(imagePath);
            return normalizedImage === normalizeImagePath("グループレッスン室.jpg")
                || normalizedImage === normalizeImagePath("上賀茂_上賀茂神社内の鳥居.jpg")
                || normalizedImage === normalizeImagePath("近隣_貴船神社たて.jpg");
        }

        function renderTableBlock(block) {
            const columns = (block && block.columns) || [];
            const rows = (block && block.rows) || [];
            if (!Array.isArray(columns) || !Array.isArray(rows) || columns.length === 0 || rows.length === 0) {
                return "";
            }
            const variant = String((block && block.variant) || "").trim();
            const isPricing = variant === "pricing";
            const wrapClass = isPricing ? "stream-table-wrap stream-table-wrap--pricing" : "stream-table-wrap";
            const tableClass = isPricing ? "stream-table stream-table--pricing" : "stream-table";
            const caption = escapeHtml(String((block && block.caption) || ""));
            const note = escapeHtml(String((block && block.note) || ""));
            const headHtml = columns
                .map((column) => `<th scope="col">${escapeHtml(String(column || ""))}</th>`)
                .join("");
            const spanTracker = new Array(columns.length).fill(0);
            const activeSpanCells = new Array(columns.length).fill(null);

            function normalizeTableCell(rawCell) {
                if (rawCell && typeof rawCell === "object" && !Array.isArray(rawCell)) {
                    const value = String(rawCell.value ?? rawCell.text ?? rawCell.label ?? "");
                    const rowspan = Number(rawCell.rowspan);
                    const colspan = Number(rawCell.colspan);
                    return {
                        value: value || "—",
                        rowspan: Number.isFinite(rowspan) && rowspan > 1 ? Math.floor(rowspan) : 1,
                        colspan: Number.isFinite(colspan) && colspan > 1 ? Math.floor(colspan) : 1
                    };
                }
                const value = String(rawCell ?? "");
                return {
                    value: value || "—",
                    rowspan: 1,
                    colspan: 1
                };
            }

            function formatTableTextWithNumericSpan(rawValue) {
                const source = String(rawValue ?? "");
                if (!source || source === "—") return escapeHtml(source || "—");
                return escapeHtml(source).replace(
                    /([0-9０-９][0-9０-９:：〜～\-ー,，．.\+xX×\/％%年月日時分回才歳円ヶか]+)/g,
                    '<span class="table-num">$1</span>'
                );
            }

            function formatPricingValueCellHtml(rawValue) {
                const source = String(rawValue ?? "").trim();
                if (!source || source === "—") return escapeHtml(source || "—");
                const segments = source.split("/");
                if (segments.length !== 2) return escapeHtml(source);
                const main = formatTableTextWithNumericSpan(String(segments[0] || "").trim());
                const price = formatTableTextWithNumericSpan(String(segments[1] || "").trim());
                if (!main || !price) return escapeHtml(source);
                return `<span class="pricing-cell-main">${main}</span><span class="pricing-cell-price">${price}</span>`;
            }

            function formatPricingFirstColumnHtml(rawValue) {
                const source = String(rawValue ?? "");
                if (!source || source === "—") return escapeHtml(source || "—");
                const marker = "※空4・時間帯要相談";
                if (!source.includes(marker)) return formatTableTextWithNumericSpan(source);
                const startTag = "%%PRICING_NOTE_BREAK_START%%";
                const endTag = "%%PRICING_NOTE_BREAK_END%%";
                const wrapped = source.replace(marker, `${startTag}${marker}${endTag}`);
                return formatTableTextWithNumericSpan(wrapped)
                    .replace(startTag, '<span class="pricing-note-break">')
                    .replace(endTag, "</span>");
            }

            const bodyHtml = rows
                .map((row) => {
                    const cells = Array.isArray(row)
                        ? row
                        : Array.isArray(row && row.cells)
                            ? row.cells
                            : [];
                    let cellPointer = 0;
                    let rowHtml = "";

                    for (let columnIndex = 0; columnIndex < columns.length; columnIndex += 1) {
                        if (spanTracker[columnIndex] > 0) {
                            const spanCell = activeSpanCells[columnIndex];
                            spanTracker[columnIndex] -= 1;
                            if (spanCell) {
                                rowHtml += `<td class="stream-table-mobile-only" data-label="${spanCell.label}">${spanCell.value}</td>`;
                            }
                            if (spanTracker[columnIndex] === 0) {
                                activeSpanCells[columnIndex] = null;
                            }
                            continue;
                        }

                        const rawCell = cellPointer < cells.length ? cells[cellPointer] : undefined;
                        cellPointer += 1;
                        const normalizedCell = normalizeTableCell(rawCell);
                        const safeColspan = Math.max(1, Math.min(normalizedCell.colspan, columns.length - columnIndex));
                        const safeRowspan = normalizedCell.rowspan;
                        const label = escapeHtml(
                            columns
                                .slice(columnIndex, columnIndex + safeColspan)
                                .map((column) => String(column || ""))
                                .join(" / ")
                        );
                        const rawValue = String(normalizedCell.value || "—");
                        let value = formatTableTextWithNumericSpan(rawValue);
                        if (isPricing && safeColspan === 1) {
                            if (columnIndex === 1) {
                                value = formatPricingValueCellHtml(rawValue);
                            } else if (columnIndex === 0) {
                                value = formatPricingFirstColumnHtml(rawValue);
                            }
                        }
                        const rowspanAttr = safeRowspan > 1 ? ` rowspan="${safeRowspan}"` : "";
                        const colspanAttr = safeColspan > 1 ? ` colspan="${safeColspan}"` : "";
                        rowHtml += `<td data-label="${label}"${rowspanAttr}${colspanAttr}>${value}</td>`;

                        if (safeRowspan > 1) {
                            for (let spanCol = columnIndex; spanCol < columnIndex + safeColspan; spanCol += 1) {
                                spanTracker[spanCol] = Math.max(spanTracker[spanCol], safeRowspan - 1);
                                activeSpanCells[spanCol] = { label, value };
                            }
                        }

                        columnIndex += safeColspan - 1;
                    }

                    return `<tr>${rowHtml}</tr>`;
                })
                .join("");
            const captionHtml = caption ? `<p class="stream-table-caption">${caption}</p>` : "";
            const noteHtml = note ? `<p class="stream-table-note">${note}</p>` : "";
            return `
                <section class="${wrapClass}">
                    ${captionHtml}
                    <div class="stream-table-scroll">
                        <table class="${tableClass}">
                            <thead>
                                <tr>${headHtml}</tr>
                            </thead>
                            <tbody>
                                ${bodyHtml}
                            </tbody>
                        </table>
                    </div>
                    ${noteHtml}
                </section>
            `;
        }

        function detectCoursePaneType(chunks) {
            const primaryHeading = (chunks || []).find((chunk) => chunk.type === "h3_strong");
            const headingText = String(primaryHeading && primaryHeading.text || "");
            if (headingText.includes("グループレッスン")) {
                return "group";
            }
            if (headingText.includes("個人レッスン")) {
                return "personal";
            }
            const sharedHeading = (chunks || []).find((chunk) => chunk.type === "h3");
            const sharedHeadingText = String(sharedHeading && sharedHeading.text || "");
            if (sharedHeadingText.includes("両コース共通の特色")) {
                return "shared";
            }
            return "";
        }

        function renderCourseQuickNav(cards) {
            const safeCards = (cards || []).filter((card) => card && card.targetId && card.title);
            if (safeCards.length === 0) {
                return "";
            }
            const cardsHtml = safeCards.map((card) => {
                const key = escapeHtml(String(card.key || ""));
                const title = escapeHtml(String(card.title || ""));
                const sub = escapeHtml(String(card.sub || ""));
                const openDay = escapeHtml(String(card.openDay || ""));
                const cta = escapeHtml(String(card.cta || "タップで詳細"));
                const targetId = escapeHtml(String(card.targetId || ""));
                return `
                    <a class="course-quick-card course-quick-card--${key}" href="#${targetId}">
                        <p class="course-quick-title">${title}</p>
                        <p class="course-quick-sub">${sub}</p>
                        <p class="course-quick-meta-row"><span class="course-quick-meta">${openDay}</span><span class="course-quick-cta">${cta} →</span></p>
                    </a>
                `;
            }).join("");
            return `<nav class="course-quick-nav" aria-label="コース導線">${cardsHtml}</nav>`;
        }

        function renderCourseWeeklyTable(timetable) {
            const columns = (timetable && timetable.columns) || [];
            const rows = (timetable && timetable.rows) || [];
            if (columns.length === 0 || rows.length === 0) {
                return "";
            }

            function formatTableTextWithNumericSpan(rawValue) {
                const source = String(rawValue ?? "");
                if (!source || source === "—") return escapeHtml(source || "—");
                return escapeHtml(source).replace(
                    /([0-9０-９][0-9０-９:：〜～\-ー,，．.\+xX×\/％%年月日時分回才歳円ヶか]+)/g,
                    '<span class="table-num">$1</span>'
                );
            }

            const headerHtml = columns
                .map((column) => `<th scope="col">${escapeHtml(String(column || ""))}</th>`)
                .join("");

            function renderWeeklyCellContent(cell) {
                const raw = String(cell || "");
                if (!raw || raw === "—") {
                    return "—";
                }

                const groupMatch = raw.match(/^グル\s*/);
                if (groupMatch) {
                    const rest = raw.slice(groupMatch[0].length);
                    return `<span class="course-pill course-pill--group">グル</span>${formatTableTextWithNumericSpan(rest)}`;
                }

                const personalMatch = raw.match(/^個人\s*/);
                if (personalMatch) {
                    const rest = raw.slice(personalMatch[0].length);
                    return `<span class="course-pill course-pill--personal">個人</span>${formatTableTextWithNumericSpan(rest)}`;
                }

                return formatTableTextWithNumericSpan(raw);
            }

            const bodyHtml = rows
                .map((row) => {
                    const label = formatTableTextWithNumericSpan(String((row && row.label) || ""));
                    const cells = (row && row.cells) || [];
                    const cellHtml = columns
                        .map((_, index) => `<td>${renderWeeklyCellContent(cells[index])}</td>`)
                        .join("");
                    return `<tr><th scope="row" class="course-weekly-label">${label}</th>${cellHtml}</tr>`;
                })
                .join("");
            const note = escapeHtml(String((timetable && timetable.note) || ""));
            const noteHtml = note ? `<p class="course-weekly-note">${note}</p>` : "";

            return `
                <section class="course-weekly" aria-label="週間時間割">
                    <p class="course-weekly-title">週間時間割（開講クラス・空状況）</p>
                    <table class="course-weekly-table">
                        <thead>
                            <tr>
                                <th scope="col" class="course-weekly-label">時間帯</th>
                                ${headerHtml}
                            </tr>
                        </thead>
                        <tbody>
                            ${bodyHtml}
                        </tbody>
                    </table>
                    ${noteHtml}
                </section>
            `;
        }

        function renderCourseBodyInline(section, sectionCoverImage, textFlow = "natural") {
            const blocks = (section && section.blocks) || [];
            const resolvedTextFlow = normalizeTextFlow(textFlow);
            let groupPaneLeadHtml = "";
            let groupPaneBodyHtml = "";
            let personalPaneLeadHtml = "";
            let personalPaneBodyHtml = "";
            const groupPaneExtras = [];
            const personalPaneExtras = [];
            const sharedPaneExtras = [];
            const remainderHtml = [];
            let lastPaneType = "";

            function splitCoursePaneLead(chunks) {
                const leadChunks = [];
                const bodyChunks = [];
                let collectingLead = true;
                (chunks || []).forEach((chunk) => {
                    const chunkType = String((chunk && chunk.type) || "");
                    if (collectingLead && (chunkType === "h3_strong" || chunkType === "h4_strong")) {
                        leadChunks.push(chunk);
                        return;
                    }
                    collectingLead = false;
                    bodyChunks.push(chunk);
                });
                return {
                    leadHtml: leadChunks.length > 0 ? renderTextChunks(leadChunks, resolvedTextFlow) : "",
                    bodyHtml: bodyChunks.length > 0 ? renderTextChunks(bodyChunks, resolvedTextFlow) : ""
                };
            }

            blocks.forEach((block) => {
                if (block.type === "text") {
                    const chunks = parseTextLines(block.lines || [], { sectionTitle: "コース・曜日・料金" });
                    const textHtml = renderTextChunks(chunks, resolvedTextFlow);
                    const paneType = detectCoursePaneType(chunks);
                    if (paneType === "group" && !groupPaneLeadHtml && !groupPaneBodyHtml) {
                        const splitPane = splitCoursePaneLead(chunks);
                        groupPaneLeadHtml = splitPane.leadHtml;
                        groupPaneBodyHtml = splitPane.bodyHtml;
                        lastPaneType = "group";
                        return;
                    }
                    if (paneType === "personal" && !personalPaneLeadHtml && !personalPaneBodyHtml) {
                        const splitPane = splitCoursePaneLead(chunks);
                        personalPaneLeadHtml = splitPane.leadHtml;
                        personalPaneBodyHtml = splitPane.bodyHtml;
                        lastPaneType = "personal";
                        return;
                    }
                    const wrappedText = `<div class="stream-text">${textHtml}</div>`;
                    if (paneType === "group") {
                        groupPaneExtras.push(wrappedText);
                        lastPaneType = "group";
                        return;
                    }
                    if (paneType === "personal") {
                        personalPaneExtras.push(wrappedText);
                        lastPaneType = "personal";
                        return;
                    }
                    if (paneType === "shared") {
                        sharedPaneExtras.push(wrappedText);
                        lastPaneType = "shared";
                        return;
                    }
                    if (lastPaneType === "group") {
                        groupPaneExtras.push(wrappedText);
                        return;
                    }
                    if (lastPaneType === "personal") {
                        personalPaneExtras.push(wrappedText);
                        return;
                    }
                    if (lastPaneType === "shared") {
                        sharedPaneExtras.push(wrappedText);
                        return;
                    }
                    remainderHtml.push(wrappedText);
                    return;
                }
                if (block.type === "gallery") {
                    const galleryHtml = renderGalleryBlock(block, sectionCoverImage);
                    if (galleryHtml) {
                        if (lastPaneType === "group") {
                            groupPaneExtras.push(galleryHtml);
                            return;
                        }
                        if (lastPaneType === "personal") {
                            personalPaneExtras.push(galleryHtml);
                            return;
                        }
                        if (lastPaneType === "shared") {
                            sharedPaneExtras.push(galleryHtml);
                            return;
                        }
                        remainderHtml.push(galleryHtml);
                    }
                    return;
                }
                if (block.type === "table") {
                    const tableHtml = renderTableBlock(block);
                    if (!tableHtml) {
                        return;
                    }
                    if (lastPaneType === "group") {
                        groupPaneExtras.push(tableHtml);
                        return;
                    }
                    if (lastPaneType === "personal") {
                        personalPaneExtras.push(tableHtml);
                        return;
                    }
                    if (lastPaneType === "shared") {
                        sharedPaneExtras.push(tableHtml);
                        return;
                    }
                    remainderHtml.push(tableHtml);
                    return;
                }
            });

            const buildCoursePane = (id, className, leadHtml, bodyHtml, extras) => {
                if (!leadHtml && !bodyHtml && extras.length === 0) {
                    return "";
                }
                const leadBlock = leadHtml ? `<div class="stream-text">${leadHtml}</div>` : "";
                const bodyBlock = bodyHtml ? `<div class="stream-text">${bodyHtml}</div>` : "";
                const tableExtras = extras.filter((entry) => String(entry || "").includes('class="stream-table-wrap'));
                const nonTableExtras = extras.filter((entry) => !String(entry || "").includes('class="stream-table-wrap'));
                return `<section id="${id}" class="${className} course-detail-anchor">${leadBlock}${tableExtras.join("")}${bodyBlock}${nonTableExtras.join("")}</section>`;
            };

            const groupPaneHtml = buildCoursePane(
                "course-detail-group",
                "course-pane course-pane--group",
                groupPaneLeadHtml,
                groupPaneBodyHtml,
                groupPaneExtras
            );
            const personalPaneHtml = buildCoursePane(
                "course-detail-personal",
                "course-pane course-pane--personal",
                personalPaneLeadHtml,
                personalPaneBodyHtml,
                personalPaneExtras
            );
            const paneHtml = [groupPaneHtml, personalPaneHtml].filter(Boolean).join("");
            const columnsHtml = paneHtml ? `<div class="course-columns">${paneHtml}</div>` : "";
            const sharedHtml = sharedPaneExtras.length > 0
                ? `<section class="course-shared">${sharedPaneExtras.join("")}</section>`
                : "";
            const quickNavHtml = renderCourseQuickNav(section.quickCards || []);
            const weeklyTableHtml = renderCourseWeeklyTable(section.timetable || {});
            return `<div class="course-layout">${quickNavHtml}${weeklyTableHtml}${remainderHtml.join("")}${columnsHtml}${sharedHtml}</div>`;
        }

        function renderBlocksInline(blocks, sectionCoverImage, sectionTitle, textFlow = "natural") {
            const resolvedTextFlow = normalizeTextFlow(textFlow);
            return (blocks || []).map((block) => {
                if (block.type === "text") {
                    const chunks = parseTextLines(block.lines || [], { sectionTitle });
                    const textHtml = renderTextChunks(chunks, resolvedTextFlow);
                    const blockClassName = resolveOptionalBlockClassName(block && block.className);
                    const safeClassName = blockClassName ? ` ${blockClassName}` : "";
                    return `<div class="stream-text${safeClassName}">${textHtml}</div>`;
                }
                if (block.type === "quote") {
                    return renderQuoteBlock(block);
                }
                if (block.type === "gallery") {
                    const shouldMobileCollapse = sectionTitle === "私の好きなもの";
                    return renderGalleryBlock(block, sectionCoverImage, { mobileCollapse: shouldMobileCollapse });
                }
                if (block.type === "table") {
                    return renderTableBlock(block);
                }
                return "";
            }).join("");
        }

        function renderSectionStream() {
            const container = document.getElementById("rooms");
            container.innerHTML = (config.sections || []).map((section, index) => {
                const id = buildSectionId(index);
                const coverImage = resolveSectionCover(section);
                const textFlow = normalizeTextFlow(section && section.textFlow);
                const subtitleHtml = section.subtitle
                    ? `<p class="stream-subtitle">${escapeHtml(section.subtitle)}</p>`
                    : "";
                const coverCaption = String((section && section.coverCaption) || "").trim();
                const coverCaptionHtml = coverCaption
                    ? `<figcaption class="stream-cover-caption">${escapeHtml(coverCaption)}</figcaption>`
                    : "";
                const coverHtml = coverImage
                    ? `<figure class="stream-cover"><img src="${toSrc(coverImage)}" data-image-path="${escapeHtml(coverImage)}" alt="" loading="lazy" decoding="async">${coverCaptionHtml}</figure>`
                    : "";
                const bodyHtml = section.title === "コース・曜日・料金"
                    ? renderCourseBodyInline(section, coverImage, textFlow)
                    : renderBlocksInline(section.blocks, coverImage, section.title, textFlow);
                return `
                    <article id="${id}" class="stream-section fade-in">
                        <h2 class="stream-header">${escapeHtml(section.title)}</h2>
                        ${subtitleHtml}
                        ${coverHtml}
                        <div class="stream-body">${bodyHtml}</div>
                    </article>
                `;
            }).join("");
        }

        function setupMobileCollapsibleGalleries() {
            const container = document.getElementById("rooms");
            if (!container || container.dataset.galleryCollapseBound === "1") return;
            container.dataset.galleryCollapseBound = "1";

            function syncGalleryToggleButton(trigger, isExpanded) {
                if (!trigger) return;
                const openLabel = String(trigger.getAttribute("data-label-open") || "other photos");
                const closeLabel = String(trigger.getAttribute("data-label-close") || "close photos");
                const textEl = trigger.querySelector(".stream-gallery-more-text");
                const iconEl = trigger.querySelector(".stream-gallery-more-icon");
                if (textEl) {
                    textEl.textContent = isExpanded ? closeLabel : openLabel;
                } else {
                    trigger.textContent = isExpanded ? `${closeLabel} ▲` : `${openLabel} ▼`;
                }
                if (iconEl) {
                    iconEl.textContent = isExpanded ? "▲" : "▼";
                }
                trigger.setAttribute("aria-expanded", isExpanded ? "true" : "false");
                trigger.setAttribute("aria-label", isExpanded ? `${closeLabel} を閉じる` : `${openLabel} を開く`);
            }

            container.querySelectorAll(".stream-gallery-wrap--mobile-collapsible .stream-gallery-more")
                .forEach((trigger) => syncGalleryToggleButton(trigger, false));

            container.addEventListener("click", (event) => {
                const trigger = event.target && event.target.closest
                    ? event.target.closest(".stream-gallery-more")
                    : null;
                if (!trigger || !container.contains(trigger)) return;
                const wrap = trigger.closest(".stream-gallery-wrap--mobile-collapsible");
                if (!wrap) return;
                const isExpanded = wrap.classList.toggle("is-expanded");
                syncGalleryToggleButton(trigger, isExpanded);
            });
        }
    </script>
</body>
