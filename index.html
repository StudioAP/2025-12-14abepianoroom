                syncHeroLayout();
                applyHeroTextTheme(HERO_TEXT_FALLBACK_THEME);

            }

            buildHeroTextThemeMap(heroSequence)

                    heroTextThemeMap = themeMap;
                    applyHeroSceneState(activeHeroSequence[currentSlideIndex] || "");
                    applyHeroTextTheme(resolveHeroTextTheme(activeHeroSequence[currentSlideIndex]));
                })

                .then((loadedTail) => {

                        slides = fallbackState.slides;
                    }
                    applyHeroSceneState(activeHeroSequence[currentSlideIndex] || "");
                    syncHeroLayout();
                    startHeroRotationIfNeeded();
                })
                .catch(() => {
                    applyHeroSceneState(activeHeroSequence[currentSlideIndex] || "");
                    syncHeroLayout();
                    startHeroRotationIfNeeded();
                });

            syncHeroLayout();
            if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
                document.fonts.ready.then(() => {
                    syncHeroLayout();
                }).catch(() => { });
            }
            window.addEventListener("resize", () => {
                syncHeroLayout();
                setHeroEndorsement();
                setHeroLocation();
            }, { passive: true });
            const desktopSplitMedia = window.matchMedia(`(min-width: ${heroSplitState.desktopMinWidth}px)`);
            const mobileSplitMedia = window.matchMedia(`(max-width: ${heroSplitState.mobileMaxWidth}px)`);
            const heroLocationMedia = window.matchMedia("(min-width: 1024px)");
            const handleHeroSplitViewportChange = () => {
                syncHeroLayout();
            };
            const handleHeroLocationViewportChange = () => {
                setHeroEndorsement();
                setHeroLocation();
            };
            if (typeof desktopSplitMedia.addEventListener === "function") {
                desktopSplitMedia.addEventListener("change", handleHeroSplitViewportChange);
            } else {
                desktopSplitMedia.addListener(handleHeroSplitViewportChange);
            }
            if (typeof mobileSplitMedia.addEventListener === "function") {
                mobileSplitMedia.addEventListener("change", handleHeroSplitViewportChange);
            } else {
                mobileSplitMedia.addListener(handleHeroSplitViewportChange);
            }
            if (typeof heroLocationMedia.addEventListener === "function") {
                heroLocationMedia.addEventListener("change", handleHeroLocationViewportChange);
            } else {
                heroLocationMedia.addListener(handleHeroLocationViewportChange);
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach((el) => observer.observe(el));
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function normalizeImagePath(path) {
            return String(path || "").trim().normalize("NFC");
        }

        function buildImagePathCandidates(path) {
            const rawPath = String(path || "").trim();
            if (!rawPath) return [];
            const candidates = [];
            const pushUnique = (value) => {
                if (!value || candidates.includes(value)) return;
                candidates.push(value);
            };
            // Prefer canonical NFC for primary load (matches current tracked assets),
            // then try NFD as a fallback for environments with decomposed filenames.
            pushUnique(rawPath.normalize("NFC"));
            pushUnique(rawPath.normalize("NFD"));
            return candidates;
        }

        function toSrc(path) {
            const candidates = buildImagePathCandidates(path);
            const preferredPath = candidates[0] || normalizeImagePath(path);
            return encodeURI(preferredPath);
        }

        function includesNormalized(text, keyword) {
            const source = String(text || "");
            const target = String(keyword || "");
            return source.normalize("NFC").includes(target.normalize("NFC"));
        }

        function normalizeGalleryImageEntry(image) {
            if (typeof image === "string") {
                const src = normalizeImagePath(image);
                if (!src) return null;
                return { src, caption: "", alt: "" };
            }
            if (image && typeof image === "object") {
                const src = normalizeImagePath(image.src || "");
                if (!src) return null;
                const caption = String(image.caption || "").trim();
                const alt = String(image.alt || "").trim();
                return { src, caption, alt };
            }
            return null;
        }

        function isHiraginoHeroImage(imagePath) {
            const target = normalizeImagePath("近隣_柊野保育園たんぼ_トップ.jpg");
            return normalizeImagePath(imagePath) === target;
        }

        function applyHeroSceneState(imagePath) {
            const body = document.body;
            if (!body) return;
            body.classList.toggle("hero-scene-hiragino", isHiraginoHeroImage(imagePath));
        }

        function buildSectionId(index) {
            return `section-${index + 1}`;
        }

        function getHeroVariantFromQuery() {
            const validVariants = new Set(["A", "B", "C", "D"]);
            const defaultVariant = String((config.hero && config.hero.variantDefault) || "C").trim().toUpperCase();
            let queryVariant = "";
            try {
                const params = new URLSearchParams(window.location.search);
                queryVariant = String(params.get("heroVariant") || "").trim().toUpperCase();
            } catch (_) {
                queryVariant = "";
            }
            if (validVariants.has(queryVariant)) {
                return queryVariant;
            }
            if (validVariants.has(defaultVariant)) {
                return defaultVariant;
            }
            return "C";
        }

        function applyHeroVariant(variant) {
            const body = document.body;
            if (!body) return;
            ["a", "b", "c", "d"].forEach((name) => {
                body.classList.remove(`hero-variant-${name}`);
            });
            const normalized = String(variant || "").trim().toLowerCase();
            const configuredDefault = String((config.hero && config.hero.variantDefault) || "C").trim().toLowerCase();
            const defaultVariant = ["a", "b", "c", "d"].includes(configuredDefault) ? configuredDefault : "c";
            const safeVariant = ["a", "b", "c", "d"].includes(normalized) ? normalized : defaultVariant;
            body.classList.add(`hero-variant-${safeVariant}`);
        }

        function normalizeHeroBandToken(value) {
            const normalized = String(value || "").trim().toLowerCase().replace(/[\s_-]/g, "");
            if (normalized === "top") return "top";
            if (normalized === "bottom") return "bottom";
            if (normalized === "bottommini") return "bottomMini";
            if (normalized === "inphototopplain" || normalized === "inphototop" || normalized === "inphoto") {
                return "inPhotoTopPlain";
            }
            return "";
        }

        function getHeroBandFromQuery() {
            const defaultBand =
                normalizeHeroBandToken(config.hero && config.hero.bandDefault) || "inPhotoTopPlain";
            let queryBand = "";
            try {
                const params = new URLSearchParams(window.location.search);
                queryBand = normalizeHeroBandToken(params.get("heroBand") || "");
            } catch (_) {
                queryBand = "";
            }
            return queryBand || defaultBand;
        }

        function applyHeroBand(band) {
            const body = document.body;
            if (!body) return;
            body.classList.remove("hero-band-top", "hero-band-bottom", "hero-band-bottom-mini", "hero-band-inphoto-top-plain");
            const defaultBand =
                normalizeHeroBandToken(config.hero && config.hero.bandDefault) || "inPhotoTopPlain";
            const safeBand = normalizeHeroBandToken(band) || defaultBand;
            const className = safeBand === "bottomMini"
                ? "hero-band-bottom-mini"
                : safeBand === "inPhotoTopPlain"
                    ? "hero-band-inphoto-top-plain"
                    : `hero-band-${safeBand}`;
            body.classList.add(className);
            syncHeroHeaderHeight();
        }

        function syncHeroHeaderHeight() {
            const hero = document.getElementById("hero-slider");
            const body = document.body;
            if (!hero) return;
            if (!body || !body.classList.contains("hero-band-inphoto-top-plain")) {
                hero.style.removeProperty("--hero-header-height");
                body && body.style.removeProperty("--section-nav-safe-height");
                body && body.style.removeProperty("--hero-nav-overlap-offset");
                return;
            }
            syncSectionNavSafeHeight();
            const heroText = hero.querySelector(".hero-txt");
            if (!heroText) {
                hero.style.removeProperty("--hero-header-height");
                return;
            }
            const rect = heroText.getBoundingClientRect();
            const headerHeight = Math.max(1, Math.ceil(rect.height));
            hero.style.setProperty("--hero-header-height", `${headerHeight}px`);
        }

        function syncSectionNavSafeHeight() {
            const body = document.body;
            const nav = document.getElementById("section-nav");
            const heroTitle = document.getElementById("hero-title");
            if (!body || !nav || !heroTitle) return;

            const isDesktopViewport = window.matchMedia("(min-width: 769px)").matches;
            const isInPhotoBand = body.classList.contains("hero-band-inphoto-top-plain");
            if (!isDesktopViewport || !isInPhotoBand) {
                body.style.setProperty("--section-nav-safe-height", "0px");
                body.style.setProperty("--hero-nav-overlap-offset", "0px");
                return;
            }

            const navRect = nav.getBoundingClientRect();
            const requiredTop = Math.ceil(navRect.bottom + 12);
            const safeHeight = Math.max(0, Math.ceil(navRect.height + navRect.top + 12));
            body.style.setProperty("--section-nav-safe-height", `${safeHeight}px`);

            let extraOffset = 0;
            for (let i = 0; i < 4; i += 1) {
                body.style.setProperty("--hero-nav-overlap-offset", `${Math.max(0, Math.ceil(extraOffset))}px`);
                const titleRect = heroTitle.getBoundingClientRect();
                const remaining = Math.ceil(requiredTop - titleRect.top);
                if (remaining <= 0) break;
                extraOffset += remaining;
            }
            body.style.setProperty("--hero-nav-overlap-offset", `${Math.max(0, Math.ceil(extraOffset))}px`);
        }

        function renderSectionNav() {
            const navList = document.getElementById("section-nav-list");
            if (!navList) return;
            const sectionLinks = (config.sections || []).map((section, index) => {
                const id = buildSectionId(index);
                return `<a class="section-link" href="#${id}">${escapeHtml(section.title)}</a>`;
            }).join("");
            const contactNav = config.contactNav || {};
            const contactLabel = escapeHtml(contactNav.label || "お問合せ");
            const contactIcon = escapeHtml(contactNav.icon || "✉");
            const contactHref = escapeHtml(contactNav.href || "#");
            const contactLink = `
                <a class="section-link section-link-contact" href="${contactHref}" target="_blank" rel="noopener">
                    <span class="section-link-contact-icon" aria-hidden="true">${contactIcon}</span>
                    <span class="section-link-contact-label">${contactLabel}</span>
                </a>
            `;
            navList.innerHTML = sectionLinks + contactLink;
            fitDesktopNavScale();
        }

        function applyNavScale(scale) {
            const navList = document.getElementById("section-nav-list");
            if (!navList) return;
            const boundedScale = Math.max(NAV_SCALE_MIN, Math.min(NAV_SCALE_TARGET, Number(scale) || NAV_SCALE_MIN));
            navList.style.setProperty("--nav-scale", String(boundedScale));
        }

        function fitDesktopNavScale() {
            const navList = document.getElementById("section-nav-list");
            if (!navList) return;
            if (!window.matchMedia("(min-width: 769px)").matches) {
                applyNavScale(1);
                syncSectionNavSafeHeight();
                return;
            }

            let currentScale = NAV_SCALE_TARGET;
            applyNavScale(currentScale);
            let safetyCounter = 0;
            while (navList.scrollWidth > navList.clientWidth + 1 && currentScale > NAV_SCALE_MIN && safetyCounter < 64) {
                currentScale = Math.max(NAV_SCALE_MIN, Number((currentScale - NAV_SCALE_STEP).toFixed(2)));
                applyNavScale(currentScale);
                safetyCounter += 1;
            }
            syncSectionNavSafeHeight();
        }

        function closeSectionNavMenu(options = {}) {
            const { blurToggle = false } = options;
            const nav = document.getElementById("section-nav");
            const toggle = document.getElementById("menu-toggle");
            if (!nav || !toggle) return;
            nav.classList.remove("is-open");
            toggle.setAttribute("aria-expanded", "false");
            if (blurToggle && typeof toggle.blur === "function") {
                toggle.blur();
            }
        }

        function setupSectionNavMenu() {
            const nav = document.getElementById("section-nav");
            const toggle = document.getElementById("menu-toggle");
            const navList = document.getElementById("section-nav-list");
            if (!nav || !toggle || !navList) return;

            const openMenu = () => {
                nav.classList.add("is-open");
                toggle.setAttribute("aria-expanded", "true");
            };
            const toggleMenu = () => {
                if (nav.classList.contains("is-open")) {
                    closeSectionNavMenu({ blurToggle: true });
                } else {
                    openMenu();
                }
            };

            toggle.addEventListener("click", (event) => {
                event.stopPropagation();
                toggleMenu();
            });
            navList.addEventListener("click", (event) => {
                if (event.target.closest(".section-link")) {
                    closeSectionNavMenu();
                }
            });
            document.addEventListener("click", (event) => {
                if (!nav.contains(event.target)) {
                    closeSectionNavMenu();
                }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeSectionNavMenu({ blurToggle: true });
                }
            });

            const desktopMedia = window.matchMedia("(min-width: 769px)");
            const handleDesktopEnter = (event) => {
                if (event.matches) {
                    closeSectionNavMenu();
                }
            };
            if (typeof desktopMedia.addEventListener === "function") {
                desktopMedia.addEventListener("change", handleDesktopEnter);
            } else {
                desktopMedia.addListener(handleDesktopEnter);
            }
            closeSectionNavMenu();
        }

        function getSectionGalleryImages(section) {
            const blocks = (section && section.blocks) || [];
            const images = [];
            blocks.forEach((block) => {
                if (block.type !== "gallery") return;
                (block.images || []).forEach((image) => {
                    const entry = normalizeGalleryImageEntry(image);
                    if (!entry) return;
                    images.push(entry.src);
                });
            });
            return images;
        }

        function resolveSectionCover(section) {
            const explicitCoverImage = normalizeImagePath((section && section.coverImage) || "");
            if (explicitCoverImage) {
                return explicitCoverImage;
            }
            const topImage = getSectionGalleryImages(section).find((image) => includesNormalized(image, "_トップ"));
            return normalizeImagePath(topImage || "");
        }

        function getHeroSequence(heroConfig) {
            const sequence = [];
            const seen = new Set();
            const rotationImages = ((heroConfig && heroConfig.rotationImages) || [])
                .map((image) => normalizeImagePath(image))
                .filter(Boolean);
            rotationImages.forEach((image) => {
                if (seen.has(image)) return;
                seen.add(image);
                const lastImage = sequence.length > 0 ? sequence[sequence.length - 1] : "";
                if (lastImage && lastImage === image) return;
                sequence.push(image);
            });
            if (sequence.length === 0) {
                const leadImage = normalizeImagePath((heroConfig && heroConfig.leadImage) || "");
                if (leadImage) {
                    sequence.push(leadImage);
                }
            }
            return sequence;
        }

        function getHeroSplitConfig(heroConfig) {
            const bottomImage = normalizeImagePath((heroConfig && heroConfig.mobileSplitBottomImage) || "");
            const leadImage = normalizeImagePath((heroConfig && heroConfig.leadImage) || "");
            const topFirstImage = normalizeImagePath((heroConfig && heroConfig.mobileSplitTopFirstImage) || "");
            const desktopTopImage = normalizeImagePath((heroConfig && heroConfig.desktopSplitTopImage) || "ぴーちゃん.jpg");
            const desktopBottomImage = normalizeImagePath((heroConfig && heroConfig.desktopSplitBottomImage) || "")
                || bottomImage
                || leadImage
                || normalizeImagePath("教室概要_イラスト_ヒーロー.jpg");
            const rawMobileMaxWidth = Number(heroConfig && heroConfig.mobileSplitMaxWidth);
            const mobileMaxWidth = Number.isFinite(rawMobileMaxWidth) && rawMobileMaxWidth > 0
                ? Math.floor(rawMobileMaxWidth)
                : 768;
            const rawDesktopMinWidth = Number(heroConfig && heroConfig.desktopSplitMinWidth);
            const desktopMinWidth = Number.isFinite(rawDesktopMinWidth) && rawDesktopMinWidth > 0
                ? Math.floor(rawDesktopMinWidth)
                : HERO_DESKTOP_SPLIT_MIN_WIDTH;
            return {
                mobileBottomImage: bottomImage || desktopBottomImage || leadImage,
                topFirstImage,
                mobileMaxWidth,
                desktopTopImage,
                desktopBottomImage,
                desktopMinWidth,
                desktopRightWidthPercent: HERO_DESKTOP_RIGHT_WIDTH_FALLBACK
            };
        }

        function isHeroMobileSplitViewport(maxWidth) {
            const safeMaxWidth = Number.isFinite(Number(maxWidth)) && Number(maxWidth) > 0
                ? Math.floor(Number(maxWidth))
                : 768;
            return window.matchMedia(`(max-width: ${safeMaxWidth}px)`).matches;
        }

        function isHeroDesktopSplitViewport(minWidth = HERO_DESKTOP_SPLIT_MIN_WIDTH) {
            const safeMinWidth = Number.isFinite(Number(minWidth)) && Number(minWidth) > 0
                ? Math.floor(Number(minWidth))
                : HERO_DESKTOP_SPLIT_MIN_WIDTH;
            return window.matchMedia(`(min-width: ${safeMinWidth}px)`).matches;
        }

        function applyHeroSplitState(state) {
            const body = document.body;
            const hero = document.getElementById("hero-slider");
            const mobileBottomLayer = document.getElementById("hero-mobile-top-fixed");
            const desktopTopLayer = document.getElementById("hero-desktop-top-fixed");
            if (!body || !hero || !mobileBottomLayer || !desktopTopLayer) return;

            const isInPhotoBand = body.classList.contains("hero-band-inphoto-top-plain");
            const mobileBottomImage = normalizeImagePath((state && state.mobileBottomImage) || "");
            const mobileBottomImageRatio = Number(state && state.mobileBottomImageRatio);
            const desktopTopImage = normalizeImagePath((state && state.desktopTopImage) || "");
            const desktopBottomImage = normalizeImagePath((state && state.desktopBottomImage) || "");
            const illustrationFrameImage = normalizeImagePath("教室概要_イラスト_ヒーロー.jpg");
            const mobileMaxWidth = Number(state && state.mobileMaxWidth) || 768;
            const desktopMinWidth = Number(state && state.desktopMinWidth) || HERO_DESKTOP_SPLIT_MIN_WIDTH;
            const rawDesktopRightWidthPercent = Number(state && state.desktopRightWidthPercent);
            const desktopRightWidthPercent = Number.isFinite(rawDesktopRightWidthPercent) && rawDesktopRightWidthPercent > 0
                ? Math.min(90, Math.max(10, rawDesktopRightWidthPercent))
                : HERO_DESKTOP_RIGHT_WIDTH_FALLBACK;
            const desktopLeftWidthVw = Math.max(1, 100 - desktopRightWidthPercent);
            const rawDesktopReferenceRatio = Number(state && state.desktopReferenceRatio);
            const desktopReferenceRatio = Number.isFinite(rawDesktopReferenceRatio) && rawDesktopReferenceRatio > 0
                ? normalizeHeroAspectRatio(rawDesktopReferenceRatio)
                : HERO_DESKTOP_REFERENCE_RATIO_FALLBACK;
            const rawDesktopTopRatio = Number(state && state.desktopTopRatio);
            const rawDesktopBottomRatio = Number(state && state.desktopBottomRatio);
            const desktopTopRatio = Number.isFinite(rawDesktopTopRatio) && rawDesktopTopRatio > 0
                ? rawDesktopTopRatio
                : HERO_DESKTOP_TOP_SHARE_FALLBACK;
            const desktopBottomRatio = Number.isFinite(rawDesktopBottomRatio) && rawDesktopBottomRatio > 0
                ? rawDesktopBottomRatio
                : HERO_DESKTOP_BOTTOM_SHARE_FALLBACK;
            const ratioSum = desktopTopRatio + desktopBottomRatio;
            const safeDesktopTopRatio = ratioSum > 0 ? (desktopTopRatio / ratioSum) : HERO_DESKTOP_TOP_SHARE_FALLBACK;
            const safeDesktopBottomRatio = ratioSum > 0 ? (desktopBottomRatio / ratioSum) : HERO_DESKTOP_BOTTOM_SHARE_FALLBACK;

            hero.style.setProperty("--hero-desktop-right-width", `${desktopRightWidthPercent.toFixed(4)}%`);
            hero.style.setProperty("--hero-desktop-left-width-vw", String(desktopLeftWidthVw));
            hero.style.setProperty("--hero-desktop-reference-ratio", String(desktopReferenceRatio));
            hero.style.setProperty("--hero-desktop-top-ratio", String(safeDesktopTopRatio));
            hero.style.setProperty("--hero-desktop-bottom-ratio", String(safeDesktopBottomRatio));

            const hasMobileBottomImage = isInPhotoBand && Boolean(mobileBottomImage);
            const hasDesktopTopImage = isInPhotoBand && Boolean(desktopTopImage);
            const hasDesktopBottomImage = isInPhotoBand && Boolean(desktopBottomImage);
            const hasAnyDesktopFixedImage = hasDesktopTopImage || hasDesktopBottomImage;
            const isMobileSplitEnabled = hasMobileBottomImage && isHeroMobileSplitViewport(mobileMaxWidth);
            const isDesktopSplitEnabled = hasAnyDesktopFixedImage
                && !isMobileSplitEnabled
                && isHeroDesktopSplitViewport(desktopMinWidth);

            body.classList.toggle("hero-mobile-split-active", isMobileSplitEnabled);
            body.classList.toggle("hero-desktop-split-active", isDesktopSplitEnabled);
            body.classList.toggle("hero-desktop-top-image-active", isDesktopSplitEnabled && hasDesktopTopImage);
            body.classList.toggle("hero-desktop-bottom-image-active", isDesktopSplitEnabled && hasDesktopBottomImage);

            const activeMobileBottomImage = isMobileSplitEnabled && hasMobileBottomImage
                ? mobileBottomImage
                : (isDesktopSplitEnabled && hasDesktopBottomImage ? desktopBottomImage : "");
            const activeDesktopTopImage = isDesktopSplitEnabled && hasDesktopTopImage
                ? desktopTopImage
                : "";

            if (isMobileSplitEnabled && hasMobileBottomImage) {
                mobileBottomLayer.style.backgroundImage = `url('${toSrc(mobileBottomImage)}')`;
                mobileBottomLayer.setAttribute("data-image-path", mobileBottomImage);
            } else if (isDesktopSplitEnabled && hasDesktopBottomImage) {
                mobileBottomLayer.style.backgroundImage = `url('${toSrc(desktopBottomImage)}')`;
                mobileBottomLayer.setAttribute("data-image-path", desktopBottomImage);
            } else {
                mobileBottomLayer.style.removeProperty("background-image");
                mobileBottomLayer.removeAttribute("data-image-path");
            }
            mobileBottomLayer.classList.toggle(
                "hero-illustration-framed",
                Boolean(activeMobileBottomImage) && activeMobileBottomImage === illustrationFrameImage
            );

            if (isDesktopSplitEnabled && hasDesktopTopImage) {
                desktopTopLayer.style.backgroundImage = `url('${toSrc(desktopTopImage)}')`;
                desktopTopLayer.setAttribute("data-image-path", desktopTopImage);
            } else {
                desktopTopLayer.style.removeProperty("background-image");
                desktopTopLayer.removeAttribute("data-image-path");
            }
            desktopTopLayer.classList.toggle(
                "hero-illustration-framed",
                Boolean(activeDesktopTopImage) && activeDesktopTopImage === illustrationFrameImage
            );

            if (isMobileSplitEnabled && Number.isFinite(mobileBottomImageRatio) && mobileBottomImageRatio > 0) {
                hero.style.setProperty("--hero-mobile-split-bottom-ratio", String(normalizeHeroAspectRatio(mobileBottomImageRatio)));
            } else {
                hero.style.removeProperty("--hero-mobile-split-bottom-ratio");
            }

            if (isDesktopSplitEnabled) {
                const quickNav = document.getElementById("mobile-quick-nav");
                const noticeEl = document.getElementById("hero-notice");
                const ctaRowEl = document.getElementById("hero-cta-row");
                const viewportHeight = Math.max(
                    0,
                    Math.floor(
                        (window.visualViewport && window.visualViewport.height)
                        || window.innerHeight
                        || document.documentElement.clientHeight
                        || 0
                    )
                );
                const navRect = quickNav && !quickNav.hidden
                    ? quickNav.getBoundingClientRect()
                    : null;
                const navHeight = navRect
                    ? Math.ceil(navRect.height)
                    : 0;
                const navBottomClearance = navRect
                    ? Math.max(0, Math.floor(viewportHeight - navRect.bottom))
                    : 0;
                const noticeHeight = noticeEl && !noticeEl.hidden
                    ? Math.ceil(noticeEl.getBoundingClientRect().height)
                    : 0;
                const ctaHeight = ctaRowEl && !ctaRowEl.hidden
                    ? Math.ceil(ctaRowEl.getBoundingClientRect().height)
                    : 0;
                const floorHeight = Math.max(0, Math.floor(viewportHeight - navHeight - navBottomClearance - noticeHeight - ctaHeight));
                hero.style.setProperty("--hero-desktop-floor-height", `${floorHeight}px`);
            } else {
                hero.style.removeProperty("--hero-desktop-floor-height");
            }
        }

        async function canLoadHeroImage(imagePath) {
            const normalizedImagePath = normalizeImagePath(imagePath);
            if (!normalizedImagePath) return false;
            return new Promise((resolve) => {
                const image = new Image();
                image.decoding = "async";
                image.onload = () => resolve(true);
                image.onerror = () => resolve(false);
                image.src = toSrc(normalizedImagePath);
            });
        }

        async function resolveHeroSplitState(heroConfig, baseSequence) {
            const normalizedBaseSequence = (baseSequence || [])
                .map((image) => normalizeImagePath(image))
                .filter(Boolean);
            const splitConfig = getHeroSplitConfig(heroConfig);
            const fixedDesktopTopImage = normalizeImagePath(splitConfig.desktopTopImage);
            const fixedDesktopBottomImage = normalizeImagePath(splitConfig.desktopBottomImage);
            const excludedImages = new Set(
                [fixedDesktopTopImage, fixedDesktopBottomImage]
                    .map((image) => normalizeImagePath(image))
                    .filter(Boolean)
            );

            const seen = new Set();
            const topSequence = [];
            const pushTopImage = (imagePath) => {
                const normalized = normalizeImagePath(imagePath);
                if (!normalized || excludedImages.has(normalized) || seen.has(normalized)) return;
                seen.add(normalized);
                topSequence.push(normalized);
            };

            pushTopImage(splitConfig.topFirstImage);
            normalizedBaseSequence.forEach((imagePath) => {
                pushTopImage(imagePath);
            });

            if (topSequence.length === 0) {
                normalizedBaseSequence.forEach((imagePath) => {
                    const normalized = normalizeImagePath(imagePath);
                    if (!normalized || seen.has(normalized)) return;
                    seen.add(normalized);
                    topSequence.push(normalized);
                });
            }

            const resolveLoadableImage = async (imagePath) => {
                const normalized = normalizeImagePath(imagePath);
                if (!normalized) return "";
                return (await canLoadHeroImage(normalized)) ? normalized : "";
            };

            const resolveImageRatioOrNull = async (imagePath) => {
                const normalized = normalizeImagePath(imagePath);
                if (!normalized) return null;
                try {
                    return normalizeHeroAspectRatio(await sampleImageAspectRatio(normalized));
                } catch (_) {
                    return null;
                }
            };

            const resolvedDesktopTopImage = await resolveLoadableImage(fixedDesktopTopImage);
            const resolvedDesktopBottomImage = await resolveLoadableImage(fixedDesktopBottomImage);
            const leftReferenceImage = normalizeImagePath(topSequence[0] || normalizedBaseSequence[0] || "");

            const resolvedDesktopReferenceRatio = (await resolveImageRatioOrNull(leftReferenceImage))
                || HERO_DESKTOP_REFERENCE_RATIO_FALLBACK;
            const resolvedDesktopTopImageRatio = await resolveImageRatioOrNull(resolvedDesktopTopImage);
            const resolvedDesktopBottomImageRatio = await resolveImageRatioOrNull(resolvedDesktopBottomImage);

            let desktopRightWidthPercent = HERO_DESKTOP_RIGHT_WIDTH_FALLBACK;
            let desktopTopRatio = HERO_DESKTOP_TOP_SHARE_FALLBACK;
            let desktopBottomRatio = HERO_DESKTOP_BOTTOM_SHARE_FALLBACK;

            if (Number.isFinite(resolvedDesktopTopImageRatio) && resolvedDesktopTopImageRatio > 0
                && Number.isFinite(resolvedDesktopBottomImageRatio) && resolvedDesktopBottomImageRatio > 0) {
                const topInv = 1 / resolvedDesktopTopImageRatio;
                const bottomInv = 1 / resolvedDesktopBottomImageRatio;
                const widthDenominator = 1 + (resolvedDesktopReferenceRatio * (topInv + bottomInv));
                if (widthDenominator > 0) {
                    desktopRightWidthPercent = 100 / widthDenominator;
                    const shareDenominator = topInv + bottomInv;
                    if (shareDenominator > 0) {
                        desktopTopRatio = topInv / shareDenominator;
                        desktopBottomRatio = 1 - desktopTopRatio;
                    }
                }
            }

            desktopRightWidthPercent = Math.min(90, Math.max(10, desktopRightWidthPercent));

            let resolvedMobileBottomImage = "";
            let mobileBottomImageRatio = null;
            const mobileBottomCandidate = normalizeImagePath(splitConfig.mobileBottomImage) || resolvedDesktopBottomImage;
            if (mobileBottomCandidate) {
                const mobileBottomImageLoadable = await canLoadHeroImage(mobileBottomCandidate);
                if (mobileBottomImageLoadable) {
                    resolvedMobileBottomImage = mobileBottomCandidate;
                    try {
                        mobileBottomImageRatio = normalizeHeroAspectRatio(await sampleImageAspectRatio(mobileBottomCandidate));
                    } catch (_) {
                        mobileBottomImageRatio = null;
                    }
                }
            }

            return {
                mobileBottomImage: resolvedMobileBottomImage,
                mobileBottomImageRatio,
                desktopTopImage: resolvedDesktopTopImage,
                desktopBottomImage: resolvedDesktopBottomImage,
                mobileMaxWidth: splitConfig.mobileMaxWidth,
                desktopMinWidth: splitConfig.desktopMinWidth,
                desktopRightWidthPercent,
                desktopReferenceRatio: resolvedDesktopReferenceRatio,
                desktopTopRatio,
                desktopBottomRatio,
                topSequence
            };
        }

        function syncHeroPreload(imagePath) {
            if (!imagePath) return;
            const preload = document.getElementById('hero-preload');
            if (!preload) return;
            preload.setAttribute('href', toSrc(imagePath));
        }

        function preloadHeroImages(images) {
            const uniqueImages = Array.from(new Set((images || []).map((image) => normalizeImagePath(image)).filter(Boolean)));
            const loadImage = (imagePath) => new Promise((resolve) => {
                const image = new Image();
                image.onload = () => resolve({ imagePath, ok: true });
                image.onerror = () => resolve({ imagePath, ok: false });
                image.src = toSrc(imagePath);
            });

            return Promise.all(uniqueImages.map(loadImage)).then((results) => {
                return results.filter((result) => result.ok).map((result) => result.imagePath);
            });
        }

        function hydrateInitialHeroSlide(firstImage) {
            const imagePath = normalizeImagePath(firstImage);
            if (!imagePath) {
                return { images: [], slides: [] };
            }
            const heroContainer = document.getElementById('hero-slider');
            if (!heroContainer) {
                return { images: [], slides: [] };
            }
            const bootSlide = heroContainer.querySelector('.slide[data-boot="1"]');
            if (bootSlide) {
                heroContainer.querySelectorAll('.slide').forEach((slide) => {
                    if (slide !== bootSlide) {
                        slide.remove();
                    }
                });
                bootSlide.style.backgroundImage = `url('${toSrc(imagePath)}')`;
                bootSlide.classList.add('active');
                bootSlide.removeAttribute("data-boot");
                return { images: [imagePath], slides: [bootSlide] };
            }
            const slides = mountHeroSlides([imagePath], { append: false, activateFirst: true });
            return { images: [imagePath], slides };
        }

        function loadRemainingHeroSlides(sequence) {
            const normalizedSequence = (sequence || []).map((image) => normalizeImagePath(image)).filter(Boolean);
            const tail = normalizedSequence.slice(1);
            if (tail.length === 0) {
                return Promise.resolve([]);
            }
            return preloadHeroImages(tail);
        }

        function syncHeroMetaRowWidth() {
            const pairs = [
                ["hero-brand-lockup", "hero-meta-row"],
                ["business-brand-lockup", "business-hero-meta-row"],
            ];
            pairs.forEach(([brandLockupId, metaRowId]) => {
                const brandLockupEl = document.getElementById(brandLockupId);
                const metaRowEl = document.getElementById(metaRowId);
                if (!metaRowEl) return;
                if (!brandLockupEl) {
                    metaRowEl.style.removeProperty("--hero-brand-inline-size");
                    return;
                }
                const width = brandLockupEl.getBoundingClientRect().width;
                if (Number.isFinite(width) && width > 0) {
                    metaRowEl.style.setProperty("--hero-brand-inline-size", `${(Math.round(width * 100) / 100).toFixed(2)}px`);
                } else {
                    metaRowEl.style.removeProperty("--hero-brand-inline-size");
                }
            });
        }

        function setHeroText() {
            const titleEl = document.getElementById('hero-title');
            const subEl = document.getElementById('hero-sub');
            const rawTitle = String((config.hero && config.hero.title) || "");
            if (rawTitle.startsWith("こぐま")) {
                const prefix = rawTitle.slice(0, 3);
                const rest = rawTitle.slice(3);
                titleEl.innerHTML = `<span class="h-title-koguma">${escapeHtml(prefix)}</span><span class="h-title-rest">${escapeHtml(rest)}</span>`;
            } else {
                titleEl.innerHTML = escapeHtml(rawTitle);
            }
            const safeSubWithBr = escapeHtml(config.hero.sub).replace(/&lt;br&gt;/g, "<br>");
            subEl.innerHTML = safeSubWithBr
                .split("<br>")
                .map((line) => line)
                .join("<br>");
            setHeroEndorsement();
            setHeroLocation();
            syncBusinessHeroCopy();
            syncHeroMetaRowWidth();
        }

        function syncBusinessHeroCopy() {
            const fieldPairs = [
                ["hero-endorsement", "business-hero-endorsement"],
                ["hero-title", "business-hero-title"],
                ["hero-sub", "business-hero-sub"],
                ["hero-location", "business-hero-location"],
            ];
            fieldPairs.forEach(([sourceId, targetId]) => {
                const sourceEl = document.getElementById(sourceId);
                const targetEl = document.getElementById(targetId);
                if (!sourceEl || !targetEl) return;
                targetEl.innerHTML = sourceEl.innerHTML;
                if ("hidden" in sourceEl && "hidden" in targetEl) {
                    targetEl.hidden = Boolean(sourceEl.hidden);
                }
                if (sourceId === "hero-location") {
                    targetEl.style.display = sourceEl.style.display || "";
                }
            });
        }

        function setHeroEndorsement() {
            const endorsementEl = document.getElementById("hero-endorsement");
            if (!endorsementEl) return;
            const heroConfig = config.hero || {};
            const endorsementText = String(heroConfig.endorsementText || "").trim();
            const endorsementLink = heroConfig.endorsementLink || {};
            const linkLabel = String(endorsementLink.label || "").trim();
            const linkHref = String(endorsementLink.href || "").trim();
            if (!endorsementText) {
                endorsementEl.hidden = true;
                endorsementEl.innerHTML = "";
                syncBusinessHeroCopy();
                return;
            }
            const textHtml = `<span class="h-endorsement-text">${escapeHtml(endorsementText)}</span>`;
            const linkHtml = linkHref
                ? `<a class="h-endorsement-link" href="${escapeHtml(linkHref)}" target="_blank" rel="noopener">${escapeHtml(linkLabel || "詳しくはこちら")}</a>`
                : "";
            endorsementEl.innerHTML = `${textHtml}${linkHtml}`;
            endorsementEl.hidden = false;
            syncBusinessHeroCopy();
        }

        function setHeroLocation() {
            const locationEl = document.getElementById('hero-location');
            if (!locationEl) return;
            const heroConfig = config.hero || {};
            const locationBadgeText = String(heroConfig.locationBadgeText || "").trim();
            const locationPrimary = String(heroConfig.locationPrimary || "").trim();
            const locationSecondary = String(heroConfig.locationSecondary || "").trim();
            const locationText = String(heroConfig.location || "").trim();

            let line1 = "";
            let line2 = "";
            if (locationBadgeText) {
                line1 = locationBadgeText;
            } else if (locationPrimary || locationSecondary) {
                line1 = locationPrimary || locationSecondary;
                line2 = locationPrimary && locationSecondary ? locationSecondary : "";
            } else {
                const openParenIndex = locationText.indexOf("（");
                if (openParenIndex > 0) {
                    line1 = locationText.slice(0, openParenIndex).trim();
                    line2 = locationText.slice(openParenIndex + 1).replace(/）/g, "").trim();
                } else {
                    line1 = locationText;
                }
            }

            if (!line1 && !line2) {
                locationEl.textContent = "";
                locationEl.style.display = "none";
                syncBusinessHeroCopy();
                syncHeroMetaRowWidth();
                return;
            }

            if (line2) {
                locationEl.innerHTML = `<span class="h-loc-line">${escapeHtml(line1)}</span><span class="h-loc-line">${escapeHtml(line2)}</span>`;
            } else {
                locationEl.textContent = line1;
            }
            locationEl.style.display = "";
            syncBusinessHeroCopy();
            syncHeroMetaRowWidth();
        }

        function renderHeroNotice() {
            const noticeEl = document.getElementById("hero-notice");
            if (!noticeEl) return;
            const heroConfig = config.hero || {};
            const noticeText = String(heroConfig.notice || "").trim();
            const noticeLink = heroConfig.noticeLink || {};
            const linkHref = String(noticeLink.href || "").trim();
            const linkLabel = String(noticeLink.label || "詳しくはこちら").trim();
            if (!noticeText && !linkHref) {
                noticeEl.hidden = true;
                noticeEl.innerHTML = "";
                return;
            }
            const textHtml = noticeText ? `<span class="hero-notice-text">${escapeHtml(noticeText)}</span>` : "";
            const linkHtml = linkHref
                ? `<a class="hero-notice-link" href="${escapeHtml(linkHref)}" target="_blank" rel="noopener">${escapeHtml(linkLabel)}</a>`
                : "";
            noticeEl.innerHTML = `${textHtml}${linkHtml}`;
            noticeEl.hidden = false;
